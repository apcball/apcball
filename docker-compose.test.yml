services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: MOG_TEST
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "5433:5432"

  odoo-test:
    image: odoo:17.0
    depends_on:
      - postgres-test
    environment:
      HOST: postgres-test
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons
    command: >
      odoo -d MOG_TEST
      --db_host=postgres-test
      --db_user=odoo
      --db_password=odoo
      --addons-path=/mnt/extra-addons
      -i buz_it_inventory
      --test-tags /buz_it_inventory
      --test-enable
      --stop-after-init
      --no-http
